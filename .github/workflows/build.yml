name: Build Kuxia APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.arch }} release
    strategy:
      matrix:
        arch: ["arm64", "all"]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17
          cache: "gradle"

      - name: Build release apk (${{ matrix.arch }})
        run: |
          chmod +x gradlew
          ./gradlew assemblerelease -Darch=${{ matrix.arch }} --no-daemon

      - name: Upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuxia-apk-${{ matrix.arch }}
          path: FCL/build/outputs/apk/release/*.apk
