name: Build Kuxia APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build arm64 release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17
          cache: "gradle"

      - name: Build release apk (arm64)
        run: |
          chmod +x gradlew
          ./gradlew assemblerelease -Darch=arm64 --no-daemon

      - name: Upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuxia-apk-arm64
          path: FCL/build/outputs/apk/release/*.apk
